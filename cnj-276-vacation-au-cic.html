<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vacation au CIC — annale CNJ 276</title>
<style>
:root{
  --bureau:#3C4642;
  --bureau-fonce:#2E3835;
  --pelure:#D9DFD6;
  --pelure-ombre:#C3CCC1;
  --encre:#19221F;
  --encre-pale:#5A6863;
  --tampon:#4A2E7A;
  --tampon-voile:rgba(74,46,122,.12);
  --rouge:#9C3125;
  --vert:#2F6B48;
  --mono:"Courier New",Courier,ui-monospace,monospace;
  --etroit:"Arial Narrow","Helvetica Neue Condensed",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bureau);
  background-image:
    repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 4px),
    radial-gradient(120% 80% at 50% 0%,rgba(255,255,255,.06),transparent 60%);
  color:var(--encre);font-family:var(--mono);font-size:16px;line-height:1.55;min-height:100vh;
}
header{
  position:sticky;top:0;z-index:30;background:var(--bureau-fonce);
  border-bottom:2px solid #1D2422;color:#C8D2CC;
  padding:.5rem clamp(.7rem,3vw,1.6rem);
  display:flex;align-items:center;gap:clamp(.6rem,3vw,2rem);flex-wrap:wrap;
}
.serv{font-family:var(--etroit);text-transform:uppercase;letter-spacing:.16em;font-size:.68rem;line-height:1.3;opacity:.7}
.serv b{display:block;font-weight:400;letter-spacing:.22em;opacity:.55;font-size:.6rem}
.pendule{margin-left:auto;text-align:right}
.pendule .h{font-size:clamp(1.3rem,5vw,1.7rem);font-weight:bold;letter-spacing:.06em;color:#EDEFE9}
.pendule .r{font-family:var(--etroit);text-transform:uppercase;letter-spacing:.14em;font-size:.62rem;opacity:.65}
.pendule.tendu .h{color:#E4A79C}
.jauge{position:absolute;left:0;bottom:0;height:2px;background:var(--rouge);width:0%;transition:width 1s linear}
header{position:sticky}

main{max-width:800px;margin:0 auto;padding:clamp(1rem,4vw,2.6rem) clamp(.7rem,4vw,1.5rem) 5rem}
.feuille{
  position:relative;background:var(--pelure);
  background-image:linear-gradient(180deg,rgba(255,255,255,.5),transparent 18%);
  box-shadow:0 1px 0 var(--pelure-ombre),0 14px 34px rgba(0,0,0,.34);
  padding:clamp(1.1rem,4vw,2.2rem) clamp(1rem,4vw,2.4rem) clamp(1.4rem,4vw,2.2rem) clamp(1.9rem,6vw,3.4rem);
}
.feuille::before{content:"";position:absolute;top:0;bottom:0;left:clamp(1.1rem,3.5vw,2rem);width:1px;background:rgba(156,49,37,.35)}
.entete{border-bottom:1px solid rgba(25,34,31,.25);padding-bottom:.8rem;margin-bottom:1.3rem}
.tampon-cote{float:right;margin:-.3rem -.4rem .4rem 1rem;border:1.5px solid var(--rouge);color:var(--rouge);
  font-family:var(--etroit);text-transform:uppercase;letter-spacing:.14em;font-size:.7rem;padding:.18rem .5rem;transform:rotate(1.6deg)}
.qualif{font-family:var(--etroit);text-transform:uppercase;letter-spacing:.2em;font-size:.66rem;color:var(--encre-pale);margin:0 0 .35rem}
h1,h2{font-family:var(--etroit);text-transform:uppercase;letter-spacing:.07em;font-weight:bold;margin:0;line-height:1.15}
h1{font-size:clamp(1.35rem,5.5vw,2rem)}
h2{font-size:clamp(1.05rem,4.4vw,1.35rem)}
.recit{white-space:pre-line;margin:0 0 1.4rem;font-size:.95rem}
.recit em{font-style:normal;background:rgba(74,46,122,.13);padding:0 .18em}

.question{border-top:1px dashed rgba(25,34,31,.3);padding-top:1.2rem}
.compteur{font-family:var(--etroit);text-transform:uppercase;letter-spacing:.18em;font-size:.64rem;color:var(--encre-pale);margin-bottom:.5rem}
.enonce{font-weight:bold;margin:0 0 1rem;font-size:1rem}
.consigne{font-family:var(--etroit);text-transform:uppercase;letter-spacing:.14em;font-size:.64rem;color:var(--tampon);margin:-.6rem 0 .9rem}

.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:rgba(255,255,255,.42);
  border:1px solid rgba(25,34,31,.28);padding:.65rem .8rem .65rem 2.4rem;margin-bottom:.5rem;cursor:pointer;position:relative;
  transition:background .12s,border-color .12s}
.opt::before{content:"";position:absolute;left:.85rem;top:.95rem;width:.72rem;height:.72rem;border:1px solid var(--encre-pale)}
.opt:hover{background:#fff;border-color:var(--encre)}
.opt[aria-pressed="true"]{border-color:var(--tampon);background:var(--tampon-voile)}
.opt[aria-pressed="true"]::before{background:var(--tampon);border-color:var(--tampon)}
.opt:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--tampon);outline-offset:2px}
.opt.fige{pointer-events:none;opacity:.72}
.opt.juste{border-color:var(--vert);background:rgba(47,107,72,.14)}
.opt.juste::before{background:var(--vert);border-color:var(--vert)}
.opt.faux{border-color:var(--rouge);background:rgba(156,49,37,.1)}

/* vrai / faux */
.vf{display:flex;gap:.6rem;align-items:flex-start;border-bottom:1px dotted rgba(25,34,31,.28);padding:.7rem 0}
.vf p{margin:0;flex:1;font-size:.93rem}
.vf .paire{display:flex;gap:.3rem;flex:0 0 auto}
.vf button{font:inherit;font-family:var(--etroit);text-transform:uppercase;letter-spacing:.12em;font-size:.68rem;
  background:rgba(255,255,255,.5);border:1px solid rgba(25,34,31,.3);color:var(--encre-pale);padding:.35rem .6rem;cursor:pointer}
.vf button[aria-pressed="true"]{background:var(--tampon);border-color:var(--tampon);color:#F1EDF7}
.vf.fige button{pointer-events:none}
.vf .sol{font-family:var(--etroit);text-transform:uppercase;letter-spacing:.14em;font-size:.64rem;flex:0 0 auto;padding-top:.45rem}
.vf .sol.ok{color:var(--vert)} .vf .sol.ko{color:var(--rouge)}

/* grille numérique */
.grille{margin-bottom:.6rem}
.ligne{display:flex;align-items:baseline;gap:.7rem;border-bottom:1px dotted rgba(25,34,31,.28);padding:.55rem 0;flex-wrap:wrap}
.ligne p{margin:0;flex:1;min-width:12rem;font-size:.93rem}
.ligne input{font:inherit;font-size:1.25rem;font-weight:bold;width:3.6rem;text-align:center;background:transparent;
  border:none;border-bottom:2px solid var(--encre);color:var(--encre);padding:.05rem .1rem}
.ligne .unite{font-family:var(--etroit);text-transform:uppercase;letter-spacing:.14em;font-size:.68rem;color:var(--encre-pale);width:3.5rem}
.ligne input:disabled{color:var(--encre-pale);border-bottom-style:dotted}

.saisie{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin-bottom:.4rem}
input[type=text]{font:inherit;font-size:1.5rem;font-weight:bold;width:5.5rem;text-align:center;background:transparent;
  border:none;border-bottom:2px solid var(--encre);color:var(--encre);padding:.1rem .2rem}
.unite{font-family:var(--etroit);text-transform:uppercase;letter-spacing:.16em;font-size:.72rem;color:var(--encre-pale)}

button.action{font-family:var(--etroit);text-transform:uppercase;letter-spacing:.16em;font-weight:bold;font-size:.78rem;
  background:var(--tampon);color:#F1EDF7;border:none;padding:.72rem 1.5rem;cursor:pointer;margin-top:.7rem}
button.action:hover{background:#5C3C93}
button.mineur{background:transparent;color:var(--encre-pale);border:1px solid rgba(25,34,31,.3);margin-left:.5rem}
button.mineur:hover{background:rgba(0,0,0,.05);color:var(--encre)}

.mention{margin-top:1.2rem;padding:.9rem 1rem;font-size:.9rem;border-left:3px solid var(--tampon);background:rgba(255,255,255,.5)}
.mention.rect{border-left-color:var(--rouge)}
.mention .tit{font-family:var(--etroit);text-transform:uppercase;letter-spacing:.18em;font-size:.64rem;color:var(--tampon);margin-bottom:.35rem}
.mention.rect .tit{color:var(--rouge)}
.mention .art{display:inline-block;margin-top:.55rem;border:1px solid var(--tampon);color:var(--tampon);
  font-family:var(--etroit);text-transform:uppercase;letter-spacing:.12em;font-size:.64rem;padding:.12rem .45rem}

.sceau{position:fixed;inset:0;display:grid;place-items:center;background:rgba(30,36,34,.72);z-index:60;padding:1rem}
.sceau .marque{border:4px double var(--tampon);color:var(--tampon);background:rgba(233,236,231,.96);
  padding:1.3rem 1.9rem;text-align:center;transform:rotate(-7deg) scale(2.6);opacity:0;animation:frappe .5s cubic-bezier(.2,1.4,.4,1) forwards}
.sceau .marque .l1{font-family:var(--etroit);text-transform:uppercase;letter-spacing:.28em;font-size:.7rem}
.sceau .marque .l2{font-size:clamp(1.6rem,7vw,2.6rem);font-weight:bold;letter-spacing:.05em;line-height:1.15}
.sceau .marque .l3{font-family:var(--etroit);text-transform:uppercase;letter-spacing:.18em;font-size:.66rem;opacity:.8;margin-top:.3rem}
@keyframes frappe{to{transform:rotate(-7deg) scale(1);opacity:1}}
.sceau .suite{margin-top:1.6rem;text-align:center}

.bilan{display:flex;gap:1.6rem;flex-wrap:wrap;margin:1.2rem 0 1.6rem}
.bilan div span{display:block;font-family:var(--etroit);text-transform:uppercase;letter-spacing:.16em;font-size:.62rem;color:var(--encre-pale)}
.bilan div b{font-size:1.5rem}
ul.fiche{padding-left:1.1rem}
.fiche li{margin-bottom:.8rem;font-size:.9rem}
.fiche li b{display:block;font-family:var(--etroit);text-transform:uppercase;letter-spacing:.1em;font-size:.7rem;color:var(--tampon)}
.pied{font-family:var(--etroit);text-transform:uppercase;letter-spacing:.16em;font-size:.62rem;color:#9AA69F;text-align:center;margin-top:2rem}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{body{background:#fff}header,button{display:none}.feuille{box-shadow:none;background:#fff}}
</style>
</head>
<body>

<header>
  <div class="serv"><b>Centre d'information et de commandement</b>Vacation de jour — poste opérateur 3</div>
  <div class="pendule" id="pendule">
    <div class="h" id="heure">08:00</div>
    <div class="r" id="reste">Compte rendu de vacation à 08:00</div>
  </div>
  <div class="jauge" id="jauge"></div>
</header>

<main id="plateau"></main>

<script>
"use strict";

/* =====================================================================
   ANNALE CNJ 276 — adaptée en jeu.
   Les infractions routières et sexuelles sont exclues : l'affaire
   support des séquences 5 (constatations, scellé, garde à vue) a été
   transposée en tentative de meurtre par strangulation, à questions
   juridiques et réponses inchangées.
   ===================================================================== */

const EVENEMENTS = [
{
  id:"ÉV. 01", heure:"09h12", titre:"Trois plaintes à l'accueil",
  nature:"Fiche d'événement — accueil du public",
  gain:{l2:"QUALIFIER",l3:"Trois faits, trois textes"},
  recit:`Le dimanche matin, l'accueil déborde. Trois personnes se présentent coup sur coup, trois récits, trois qualifications à poser avant toute chose.
Le chef de poste ne vous demande pas si c'est grave. Il vous demande <em>quel texte</em>.`,
  questions:[
    {
      type:"qcm",
      enonce:"SITUATION A — Monsieur X explique que deux personnes sans domicile fixe, accompagnées de gros chiens particulièrement impressionnants, lui ont demandé de l'argent sur le trottoir. Se sentant en danger à cause des chiens, il leur a remis un billet de 10 euros.",
      options:[
        "Vol avec violences",
        "Demande de fonds sous contrainte",
        "Escroquerie",
        "Aucune infraction : la mendicité n'est pas pénalement réprimée"
      ],
      bonne:1,
      indice:"Cherchez du côté d'une incrimination spéciale, logée juste après l'extorsion dans le code pénal.",
      mention:`La demande de fonds sous contrainte. Le texte vise le fait, en réunion et de manière agressive, OU sous la menace d'un animal dangereux, de solliciter sur la voie publique la remise de fonds, de valeurs ou d'un bien. Six mois d'emprisonnement et 3 750 euros d'amende.
Trois points de vigilance. Les deux procédés sont alternatifs, pas cumulatifs : ici la menace de l'animal dangereux suffit. L'infraction est consommée par la seule sollicitation, la remise n'est pas nécessaire. Et le lieu compte : la voie publique est un élément constitutif.
À écarter : le vol, car il y a remise volontaire et donc aucune soustraction. L'extorsion (obtenir par violence, menace de violences ou contrainte) peut entrer en concours, mais l'incrimination spéciale épouse exactement les faits.`,
      art:"Art. 312-12-1 CP"
    },
    {
      type:"qcm",
      enonce:"SITUATION B — Madame Y explique qu'un individu lui a ordonné de remettre son téléphone portable sous la menace d'un cutter. Elle a réussi à prendre la fuite sans rien lui remettre.",
      options:[
        "Vol avec arme",
        "Tentative de vol avec arme",
        "Tentative d'extorsion avec usage ou menace d'une arme",
        "Menace de mort avec arme"
      ],
      bonne:2,
      indice:"L'auteur n'a pas cherché à prendre : il a exigé qu'on lui remette. Et rien n'a été obtenu.",
      mention:`Tentative d'extorsion avec usage ou menace d'une arme.
Le partage vol / extorsion tient à un seul mot : la soustraction contre la remise. L'auteur n'a pas pris le téléphone, il a exigé qu'on le lui remette sous la contrainte : c'est l'extorsion.
Rien n'a été obtenu, la victime ayant fui : on reste au stade de la tentative. Elle est caractérisée, car il y a commencement d'exécution (l'ordre appuyé par le cutter) et l'absence de résultat tient à des circonstances indépendantes de la volonté de l'auteur. La tentative d'extorsion est expressément punissable.
Le cutter est une arme par destination. L'extorsion commise avec usage ou menace d'une arme est un crime puni de vingt ans de réclusion criminelle.`,
      art:"Art. 312-1, 312-6 et 312-9 CP"
    },
    {
      type:"qcm",
      enonce:"SITUATION C — Monsieur Z, pompiste, explique qu'un automobiliste s'est fait servir du carburant puis a quitté la station en se sachant dans l'impossibilité absolue de payer.",
      options:[
        "Vol de carburant",
        "Escroquerie",
        "Filouterie de carburant",
        "Abus de confiance"
      ],
      bonne:2,
      indice:"Le pompiste a servi de son plein gré, et l'automobiliste n'a raconté aucune histoire.",
      mention:`La filouterie de carburant, souvent appelée grivèlerie. Le texte vise celui qui se fait servir des carburants ou lubrifiants dont il fait remplir en tout ou partie les réservoirs d'un véhicule, en sachant être dans l'impossibilité absolue de payer ou en étant déterminé à ne pas payer. Six mois d'emprisonnement et 7 500 euros d'amende.
Pourquoi pas le vol : le carburant a été remis volontairement par le pompiste, il n'y a pas de soustraction frauduleuse.
Pourquoi pas l'escroquerie : aucune manœuvre frauduleuse, aucun faux nom, aucune mise en scène. C'est précisément parce que ces deux qualifications échouent que le législateur a créé la filouterie.
L'élément moral est ici décisif : la connaissance de son impossibilité de payer doit exister au moment où l'on se fait servir.`,
      art:"Art. 313-5 CP"
    }
  ]
},
{
  id:"ÉV. 02", heure:"10h05", titre:"Le classeur du chef de poste",
  nature:"Note de service — rappels de droit pénal général",
  gain:{l2:"1 · 6 · 20",l3:"Les délais tiennent la vacation"},
  recit:`Entre deux appels, le chef de poste pose un classeur devant vous, ouvert à la page des délais.
« Tu as vingt personnes par jour qui viennent déposer plainte pour des faits d'il y a huit ans. Si tu ne connais pas ces chiffres, tu leur fais perdre leur temps et tu fais perdre le sien au parquet. »`,
  questions:[
    {
      type:"grille",
      enonce:"Selon la classification tripartite, quels sont les délais de prescription de l'ACTION PUBLIQUE, en droit commun ?",
      consigne:"Trois nombres à porter",
      champs:[
        {label:"A — Les contraventions", bonne:"1", unite:"an"},
        {label:"B — Les délits", bonne:"6", unite:"ans"},
        {label:"C — Les crimes", bonne:"20", unite:"ans"}
      ],
      indice:"Une progression simple, dont le dernier terme est celui de la réclusion criminelle à temps la plus longue.",
      mention:`Un an pour les contraventions, six ans pour les délits, vingt ans pour les crimes, à compter du jour où l'infraction a été commise.
Ces délais sont ceux du droit commun. De nombreux régimes dérogatoires existent : trente ans pour certains crimes (terrorisme, trafic de stupéfiants, crimes de guerre), imprescriptibilité des crimes contre l'humanité, et pour les crimes commis sur des mineurs un délai de trente ans qui ne commence à courir qu'à la majorité de la victime.
Retenez aussi la distinction entre suspension (le délai s'arrête puis reprend) et interruption (un acte de poursuite ou d'instruction fait repartir un délai entier).`,
      art:"Art. 7, 8 et 9 CPP"
    },
    {
      type:"grille",
      enonce:"Et les délais de prescription de la PEINE ?",
      consigne:"Attention : un seul de ces trois chiffres change par rapport à l'action publique",
      champs:[
        {label:"A — Les contraventions", bonne:"3", unite:"ans"},
        {label:"B — Les délits", bonne:"6", unite:"ans"},
        {label:"C — Les crimes", bonne:"20", unite:"ans"}
      ],
      indice:"La contravention se prescrit plus vite pour poursuivre que pour exécuter.",
      mention:`Trois ans pour les contraventions, six ans pour les délits, vingt ans pour les crimes, à compter de la date à laquelle la décision est devenue définitive.
Le seul écart avec la prescription de l'action publique porte sur les contraventions : un an pour poursuivre, mais trois ans pour exécuter la peine. C'est exactement le point que l'examen cherche.
Ne confondez pas les deux mécanismes : la prescription de l'action publique éteint le droit de poursuivre, celle de la peine éteint le droit de faire exécuter une condamnation déjà prononcée.`,
      art:"Art. 133-2 à 133-4 CP"
    },
    {
      type:"multi",
      enonce:"Hormis la classification tripartite, quelles autres manières de classer les infractions existent ?",
      consigne:"Deux réponses attendues",
      options:[
        "Selon la nature de l'infraction : de droit commun, politique, militaire",
        "Selon le mode d'exécution : instantanée ou continue, simple ou d'habitude, de commission ou d'omission",
        "Selon la juridiction compétente : tribunal de police, tribunal correctionnel, cour d'assises",
        "Selon le montant du préjudice subi par la victime",
        "Selon l'âge de l'auteur des faits"
      ],
      bonnes:[0,1],
      indice:"Une classification tient à ce que l'infraction est, l'autre à la manière dont elle se commet. Le troisième item n'est qu'une conséquence de la classification tripartite.",
      mention:`Deux autres classifications structurent le droit pénal général.
Selon la nature de l'infraction : de droit commun, politique ou militaire. L'intérêt est pratique — juridiction, régime de détention, extradition, amnistie.
Selon le mode d'exécution, c'est-à-dire l'élément matériel : instantanée ou continue (le point de départ de la prescription en dépend), simple ou d'habitude (une seule occurrence ne suffit pas pour la seconde), de commission ou d'omission, formelle ou matérielle.
La répartition entre tribunal de police, tribunal correctionnel et cour d'assises n'est pas une classification autonome : c'est la conséquence directe de la classification tripartite.`,
      art:"Classifications doctrinales"
    }
  ]
},
{
  id:"ÉV. 03", heure:"14h00", titre:"Coups de feu",
  nature:"Message d'intervention — 14h00",
  gain:{l2:"TENTATIVE",l3:"Affaire GRASSET"},
  recit:`14h00. Une intervention est en cours suite à des coups de feu.
La victime, monsieur GRASSET, explique qu'il se trouvait en présence d'un ami prénommé Bernard quand une altercation a éclaté entre eux, au sujet d'une histoire de longue date. Bernard a sorti une arme et fait feu dans sa direction en déclarant : « tu mérites de mourir depuis longtemps ». Il l'a manqué de peu, puis a pris la fuite. Les faits datent de 13h30.
L'enquête établira que Bernard s'est fait remettre le pistolet par un certain Georges, en prétextant vouloir l'essayer au stand de tir de son club.`,
  questions:[
    {
      type:"qcm",
      enonce:"De quelle infraction précise monsieur GRASSET est-il victime ?",
      options:[
        "Violences volontaires avec arme",
        "Tentative de meurtre",
        "Tentative d'assassinat",
        "Menace de mort avec arme"
      ],
      bonne:2,
      indice:"Demandez-vous à quel moment Bernard s'est procuré l'arme, et pourquoi il a menti pour l'obtenir.",
      mention:`Tentative d'assassinat, c'est-à-dire tentative de meurtre commis avec préméditation.
L'intention de donner la mort est établie : tir dirigé vers la personne, propos tenus au moment du coup de feu. Sans cette intention, on retomberait sur des violences volontaires avec arme.
La préméditation se déduit ici de la ruse employée en amont pour se procurer le pistolet : le dessein était formé avant l'action, ce qui distingue l'assassinat du meurtre simple.
Enfin, le résultat a manqué pour une raison indépendante de la volonté de l'auteur — il a manqué sa cible — ce qui caractérise la tentative. La tentative de crime est toujours punissable, et elle est punie des mêmes peines que l'infraction consommée.`,
      art:"Art. 121-5, 221-1 et 221-3 CP"
    },
    {
      type:"qcm",
      enonce:"Georges, qui a remis le pistolet à Bernard en croyant qu'il s'agissait de tir sportif, pourra-t-il être poursuivi pénalement ?",
      options:[
        "Oui, comme complice par fourniture de moyens : la remise de l'arme a permis le crime",
        "Oui, comme coauteur, puisque sans l'arme le crime était impossible",
        "Non au titre de la complicité, faute d'élément intentionnel — mais il reste susceptible de poursuites pour la remise irrégulière de l'arme",
        "Non, en aucun cas : il a été trompé, aucune poursuite n'est envisageable"
      ],
      bonne:2,
      indice:"La complicité n'est pas une question de causalité matérielle. Et une arme ne se prête pas librement.",
      mention:`Pas de complicité. Le complice est celui qui, sciemment, par aide ou assistance, a facilité la préparation ou la consommation de l'infraction. L'élément intentionnel est indispensable : il faut la conscience et la volonté de s'associer au projet délictueux.

  {label:"Prescription de la peine, en matière contraventionnelle", bonne:"3", unite:"ans"}
];

/* ========================= MOTEUR ========================= */
const DUREE = 45*60;
const H_DEBUT = 8*60, H_FIN = 32*60;   // 08h00 -> 08h00
let reste = DUREE, chrono = null, demarre = false;
let iEv = 0, iQ = 0, penalites = 0;
let selection = [], vfSel = [], essais = 0;
const acquis = [];

const plateau = document.getElementById("plateau");
const elHeure = document.getElementById("heure");
const elReste = document.getElementById("reste");
const elJauge = document.getElementById("jauge");
const elPendule = document.getElementById("pendule");

function fmt(s){const m=Math.floor(Math.abs(s)/60),r=Math.abs(s)%60;return (s<0?"-":"")+String(m).padStart(2,"0")+":"+String(r).padStart(2,"0");}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function recit(t){return esc(t).replace(/&lt;em&gt;/g,"<em>").replace(/&lt;\/em&gt;/g,"</em>").replace(/\n/g,"<br>");}
function para(t){return esc(t).replace(/\n/g,"<br>");}

function pendule(){
  const ecoule = Math.min(DUREE-reste, DUREE);
  const t = H_DEBUT + (ecoule/DUREE)*(H_FIN-H_DEBUT);
  const h = Math.floor(t/60)%24, m = Math.floor(t%60);
  elHeure.textContent = String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
  elReste.textContent = reste>0 ? "Reste "+fmt(reste)+" avant la relève" : "Relève dépassée — "+fmt(reste);
  elJauge.style.width = Math.min(100,(ecoule/DUREE)*100)+"%";
  elPendule.classList.toggle("tendu", reste<=420);
}
function lancer(){ if(demarre) return; demarre=true; chrono=setInterval(()=>{reste--;pendule();},1000); }
function penalite(s){ reste-=s; penalites+=s; pendule(); }

/* ========================= ÉCRANS ========================= */
function accueil(){
  const nbQ = EVENEMENTS.reduce((n,e)=>n+e.questions.length,0);
  plateau.innerHTML = `
  <div class="feuille">
    <div class="entete">
      <p class="qualif">Contrôle national judiciaire — annale 276</p>
      <h1>Vacation au centre de commandement</h1>
    </div>
    <p class="recit">Vingt-quatre heures de vacation, sept événements, ${nbQ} séquences à traiter.
Les affaires n'ont rien à voir entre elles — c'est exactement ce qui vous attend derrière un poste opérateur, et c'est exactement ce que teste l'annale.

Vous devrez qualifier des faits, tenir des délais, décider d'un scellé, nommer des actes, et dire au nom de quel texte on prive quelqu'un de sa liberté.

Une erreur coûte <em>une minute</em> de vacation. Aucune ne bloque : chaque réponse, juste ou fausse, est expliquée article à l'appui, et tout est repris en fiche à la fin.

À 08h00, vous remettez votre compte rendu : une grille de six durées, celles qui reviennent à chaque procédure.</p>
    <button class="action" id="go">Prendre le poste</button>
    <p class="pied" style="text-align:left;margin-top:1.4rem">Annale CNJ 276 — durée estimée 45 minutes — jeu solo, hors connexion</p>
  </div>`;
  document.getElementById("go").onclick = ()=>{ lancer(); rendre(); };
}

function rendre(){
  const ev = EVENEMENTS[iEv], q = ev.questions[iQ];
  selection = []; vfSel = (q.type==="vf") ? q.items.map(()=>null) : []; essais = 0;

  let champ = "";
  if(q.type==="num"){
    champ = `<div class="saisie"><input type="text" id="saisie" inputmode="numeric" autocomplete="off" maxlength="3" aria-label="Votre réponse">
      <span class="unite">${esc(q.unite||"")}</span></div>`;
  }else if(q.type==="grille"){
    champ = `<div class="grille">`+q.champs.map((c,i)=>
      `<div class="ligne"><p>${esc(c.label)}</p>
        <input type="text" inputmode="numeric" maxlength="3" data-i="${i}" aria-label="${esc(c.label)}">
        <span class="unite">${esc(c.unite)}</span></div>`).join("")+`</div>`;
  }else if(q.type==="vf"){
    champ = q.items.map((it,i)=>
      `<div class="vf" data-i="${i}"><p>${esc(it.label)}</p>
        <span class="paire">
          <button type="button" data-v="1" aria-pressed="false">Vrai</button>
          <button type="button" data-v="0" aria-pressed="false">Faux</button>
        </span><span class="sol"></span></div>`).join("");
  }else{
    champ = q.options.map((o,i)=>`<button class="opt" type="button" data-i="${i}" aria-pressed="false">${esc(o)}</button>`).join("");
  }

  plateau.innerHTML = `
  <div class="feuille">
    <div class="entete">
      <span class="tampon-cote">${esc(ev.id)} · ${esc(ev.heure)}</span>
      <p class="qualif">${esc(ev.nature)}</p>
      <h2>${esc(ev.titre)}</h2>
      ${iQ===0 ? `<p class="recit" style="margin-top:1.1rem">${recit(ev.recit)}</p>` : ``}
    </div>
    <div class="question">
      <p class="compteur">Événement ${iEv+1} sur ${EVENEMENTS.length} — séquence ${iQ+1} sur ${ev.questions.length}</p>
      <p class="enonce">${esc(q.enonce)}</p>
      ${q.consigne?`<p class="consigne">${esc(q.consigne)}</p>`:""}
      ${champ}
      <button class="action" id="valider">Verser la réponse</button>
      <div id="retour"></div>
    </div>
  </div>
  <p class="pied">Une erreur = une minute de vacation</p>`;

  if(q.type==="num"){
    const s=document.getElementById("saisie"); s.focus();
    s.addEventListener("keydown",e=>{if(e.key==="Enter")valider();});
  }else if(q.type==="grille"){
    const ch=[...plateau.querySelectorAll(".ligne input")];
    ch.forEach((c,i)=>c.addEventListener("keydown",e=>{if(e.key==="Enter"){ if(ch[i+1]) ch[i+1].focus(); else valider(); }}));
    ch[0].focus();
  }else if(q.type==="vf"){
    plateau.querySelectorAll(".vf").forEach(ligne=>{
      const i=+ligne.dataset.i;
      ligne.querySelectorAll("button").forEach(b=>{
        b.onclick=()=>{
          ligne.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));
          b.setAttribute("aria-pressed","true");
          vfSel[i] = b.dataset.v==="1";
        };
      });
    });
  }else{
    plateau.querySelectorAll(".opt").forEach(b=>{
      b.onclick=()=>{
        const i=+b.dataset.i;
        if(q.type==="multi"){
          const on=b.getAttribute("aria-pressed")==="true";
          b.setAttribute("aria-pressed",on?"false":"true");
          selection = on ? selection.filter(x=>x!==i) : selection.concat(i);
        }else{
          plateau.querySelectorAll(".opt").forEach(o=>o.setAttribute("aria-pressed","false"));
          b.setAttribute("aria-pressed","true"); selection=[i];
        }
      };
    });
  }
  document.getElementById("valider").onclick = valider;
  window.scrollTo({top:0,behavior:"instant"});
}

function valider(){
  const ev = EVENEMENTS[iEv], q = ev.questions[iQ];
  let juste=false, vide=false;

  if(q.type==="num"){
    const v=(document.getElementById("saisie").value||"").replace(/\D/g,"");
    if(!v) vide=true; else juste = v===q.bonne;
  }else if(q.type==="grille"){
    const ch=[...plateau.querySelectorAll(".ligne input")].map(c=>c.value.replace(/\D/g,""));
    if(ch.some(v=>!v)) vide=true;
    else juste = ch.every((v,i)=>v===q.champs[i].bonne);
  }else if(q.type==="vf"){
    if(vfSel.some(v=>v===null)) vide=true;
    else juste = vfSel.every((v,i)=>v===q.items[i].bonne);
  }else if(q.type==="multi"){
    if(!selection.length) vide=true;
    else juste = selection.slice().sort((a,b)=>a-b).join(",")===q.bonnes.slice().sort((a,b)=>a-b).join(",");
  }else{
    if(!selection.length) vide=true; else juste = selection[0]===q.bonne;
  }

  const retour=document.getElementById("retour");
  if(vide){
    retour.innerHTML=`<div class="mention rect"><div class="tit">Séquence incomplète</div>Rien n'est versé à la procédure. Répondez à tous les points avant de valider.</div>`;
    return;
  }

  essais++;
  if(juste){ resoudre(true); return; }
  penalite(60);
  if(essais===1){
    retour.innerHTML=`<div class="mention rect"><div class="tit">Rectification demandée — une minute perdue</div>
      La réponse ne peut pas être versée en l'état. ${esc(q.indice)}<br><br>Reprenez la séquence.</div>`;
  }else{
    resoudre(false);
  }
}

function resoudre(juste){
  const ev = EVENEMENTS[iEv], q = ev.questions[iQ];

  plateau.querySelectorAll(".opt").forEach(b=>{
    const i=+b.dataset.i; b.classList.add("fige");
    const ok = q.type==="multi" ? q.bonnes.includes(i) : i===q.bonne;
    if(ok) b.classList.add("juste");
    else if(b.getAttribute("aria-pressed")==="true") b.classList.add("faux");
  });
  plateau.querySelectorAll(".vf").forEach(ligne=>{
    const i=+ligne.dataset.i; ligne.classList.add("fige");
    const bon=q.items[i].bonne, don=vfSel[i];
    const sol=ligne.querySelector(".sol");
    sol.textContent = bon ? "Vrai" : "Faux";
    sol.className = "sol "+(don===bon?"ok":"ko");
  });
  const s=document.getElementById("saisie");
  if(s){ s.disabled=true; if(!juste) s.value=q.bonne; }
  plateau.querySelectorAll(".ligne input").forEach((c,i)=>{ c.disabled=true; if(!juste) c.value=q.champs[i].bonne; });

  document.getElementById("valider").remove();
  acquis.push({art:q.art, texte:q.mention, ev:ev.id, ok:juste});

  document.getElementById("retour").innerHTML=`
    <div class="mention">
      <div class="tit">${juste?"Séquence validée":"Correction versée à la procédure"}</div>
      ${para(q.mention)}
      <div class="art">${esc(q.art)}</div>
    </div>
    <button class="action" id="suite">${iQ+1<ev.questions.length?"Séquence suivante":"Clore l'événement"}</button>`;

  document.getElementById("suite").onclick=()=>{
    if(iQ+1<ev.questions.length){ iQ++; rendre(); }
    else sceau(ev);
  };
  document.getElementById("suite").scrollIntoView({block:"nearest"});
}

function sceau(ev){
  const d=document.createElement("div"); d.className="sceau";
  d.innerHTML=`<div>
    <div class="marque">
      <div class="l1">${esc(ev.id)} — clos à ${esc(ev.heure)}</div>
      <div class="l2">${esc(ev.gain.l2)}</div>
      <div class="l3">${esc(ev.gain.l3)}</div>
    </div>
    <div class="suite"><button class="action" id="continuer">${iEv+1<EVENEMENTS.length?"Événement suivant":"Rédiger le compte rendu"}</button></div>
  </div>`;
  document.body.appendChild(d);
  const b=d.querySelector("#continuer"); b.focus();
  b.onclick=()=>{ d.remove(); if(iEv+1<EVENEMENTS.length){ iEv++; iQ=0; rendre(); } else finale(); };
}

/* ========================= COMPTE RENDU ========================= */
function finale(){
  plateau.innerHTML=`
  <div class="feuille">
    <div class="entete">
      <span class="tampon-cote">08h00</span>
      <p class="qualif">Compte rendu de fin de vacation</p>
      <h2>Les six durées</h2>
    </div>
    <p class="recit">Sept événements traités. Le formateur ne relira pas vos procédures : il vous demande les six durées qui reviennent dans toutes.
Toutes ont été rencontrées cette nuit.</p>
    <div class="grille" id="syn">
      ${SYNTHESE.map((c,i)=>`<div class="ligne"><p>${esc(c.label)}</p>
        <input type="text" inputmode="numeric" maxlength="3" data-i="${i}" aria-label="${esc(c.label)}">
        <span class="unite">${esc(c.unite)}</span></div>`).join("")}
    </div>
    <button class="action" id="remettre">Remettre le compte rendu</button>
    <div id="retour"></div>
  </div>`;

  const ch=[...plateau.querySelectorAll("#syn input")];
  ch.forEach((c,i)=>c.addEventListener("keydown",e=>{if(e.key==="Enter"){ if(ch[i+1]) ch[i+1].focus(); else document.getElementById("remettre").click(); }}));
  ch[0].focus();

  document.getElementById("remettre").onclick=()=>{
    const v=ch.map(c=>c.value.replace(/\D/g,""));
    if(v.some(x=>!x)){
      document.getElementById("retour").innerHTML=`<div class="mention rect"><div class="tit">Compte rendu incomplet</div>Six durées sont attendues.</div>`;
      return;
    }
    const faux = v.map((x,i)=>x===SYNTHESE[i].bonne?null:i).filter(x=>x!==null);
    if(!faux.length){ clearInterval(chrono); bilan(); }
    else{
      penalite(60);
      document.getElementById("retour").innerHTML=`<div class="mention rect"><div class="tit">Compte rendu refusé — une minute perdue</div>
        ${faux.length} ligne${faux.length>1?"s":""} ${faux.length>1?"sont fausses":"est fausse"}. Reprenez vos fiches : ces six nombres ont tous été donnés au cours de la vacation.</div>`;
    }
  };
  window.scrollTo({top:0,behavior:"instant"});
}

function bilan(){
  const total=acquis.length, justes=acquis.filter(a=>a.ok).length;
  const utilise=DUREE-reste, retard=reste<0;
  plateau.innerHTML=`
  <div class="feuille">
    <div class="entete">
      <span class="tampon-cote">Relève</span>
      <p class="qualif">${retard?"Compte rendu remis après la relève":"Compte rendu remis dans les temps"}</p>
      <h1>${retard?"La relève vous a attendu":"Vacation close"}</h1>
    </div>
    <p class="recit">${retard
      ? "Le fond est là, le rythme n'y est pas. À l'examen, le temps fait partie de l'épreuve : une réponse juste rendue trop tard ne compte pas."
      : "Sept événements, vingt-deux séquences, un compte rendu exact avant la relève. C'est le format de l'annale 276, tenu de bout en bout."}</p>

    <div class="bilan">
      <div><span>Séquences traitées</span><b>${total}</b></div>
      <div><span>Justes du premier coup</span><b>${justes}/${total}</b></div>
      <div><span>Temps de vacation</span><b>${fmt(utilise)}</b></div>
      <div><span>Minutes perdues</span><b>${Math.round(penalites/60)}</b></div>
    </div>

    <h2 style="margin-bottom:.8rem">Fiche de révision — annale CNJ 276</h2>
    <ul class="fiche">
      ${acquis.map(a=>`<li><b>${esc(a.art)} — ${esc(a.ev)}${a.ok?"":" · reprise"}</b>${para(a.texte)}</li>`).join("")}
    </ul>

    <button class="action" id="imprimer">Imprimer la fiche</button>
    <button class="action mineur" id="rejouer">Reprendre une vacation</button>
  </div>
  <p class="pied">Annale adaptée — infractions routières et sexuelles exclues</p>`;

  document.getElementById("imprimer").onclick=()=>window.print();
  document.getElementById("rejouer").onclick=()=>{
    reste=DUREE; demarre=false; iEv=0; iQ=0; penalites=0; acquis.length=0; pendule(); accueil();
  };
  window.scrollTo({top:0,behavior:"instant"});
}

pendule();
accueil();
</script>
</body>
</html>
